name: Refresh Stores
on:
  schedule:
    - cron: '*/30 * * * *'  # tiap 30 menit: aman untuk batas deploy Vercel Hobby (100/hari) dan menit Actions repo private
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stores
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test refresh validation
        run: python3 -m unittest -v test_refresh_stores.py

      - name: Fetch latest stores
        run: python3 refresh_stores.py

      - name: Commit and push if changed
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stores.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # [skip ci] = Vercel tidak membuat deploy otomatis (diblokir untuk commit bot); deploy dipicu lewat Deploy Hook di bawah.
          git commit -m "Auto-refresh stores [$(date -u +%Y-%m-%dT%H:%M:%SZ)] [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK belum diisi, deploy dilewati"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy hook dipanggil"
